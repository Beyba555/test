<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="login">
            <h1>Регистрация</h1>
            <p>Создайте аккаунт</p>
            <div class="login-form">
                <span>Имя</span>
                <input type="text" placeholder="Введите имя" id="name">
                <span>Фамилия</span>
                <input type="text" placeholder="Введите фамилию" id="surname">
                <span>Почта</span>
                <input type="email" placeholder="Введите почту" id="email">
                <span>Пароль</span>
                <input type="password" placeholder="Придумайте пароль" id="password">
                <span>Подтвердите пароль</span>
                <input type="password" placeholder="Подтвердите пароль" id="confirm-password">
                <button type="button">Зарегистрироваться</button>
                <a href="index.html">Уже есть аккаунт? Войти</a>
            </div>
        </div>
    </main>
</body>
</html>
